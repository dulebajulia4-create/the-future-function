<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Future Function</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>The Future Function</h1>
            <p class="subtitle">
                A different way to think about life's uncertainties.
            </p>
        </header>

        <section class="input-section">
            <label for="problem">
                What decision, uncertainty, or problem are you facing?
            </label>

            <textarea
                id="problem"
                placeholder="I'm trying to decide whether..."
                rows="5"
            ></textarea>

            <button id="analyzeButton" onclick="analyzeProblem()">
                Explore the mathematics
            </button>
        </section>

        <section id="responseSection" class="response-section">
            <div id="responseArea"></div>
        </section>

        <footer>
            <p>
                Mathematics cannot predict every outcome.
                It can help us understand our choices.
            </p>
        </footer>
    </main>

    <script src="/script.js"></script>
</body>
</html>
