<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Future Function</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <nav class="navbar">
            <div class="logo">the future function.</div>
            <div class="nav-label">A mathematical reflection tool</div>
        </nav>

        <section class="hero">

            <p class="eyebrow">A DIFFERENT WAY TO THINK</p>

            <h1>
                What if your problems<br>
                were equations?
            </h1>

            <p class="description">
                Explore life's uncertainties through the logic,
                patterns, and possibilities of mathematics.
            </p>

            <div class="input-section">

                <textarea
                    id="problemInput"
                    placeholder="What's on your mind?"
                    rows="5"
                ></textarea>

                <div class="input-footer">

                    <p class="input-hint">
                        There's no right or wrong question.
                    </p>


                    <button id="exploreButton">
                        Explore mathematically ↗
                    </button>

                </div>

            </div>

            <div id="responseArea" class="response-area"></div>

        </section>

        <footer>
            <p>Mathematics meets the human experience.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
